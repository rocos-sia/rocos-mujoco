                '
          headers:
            Content-Disposition:
              required: false
              description: attachment; filename="rocos-app_....log"
              schema:
                type: string
            X-Rocos-Log-Snapshot-Time:
              required: false
              description: 带时区偏移的快照时间。
              schema:
                type: string
                format: date-time
            Cache-Control:
              required: false
              description: ''
              schema:
                type: string
                example: no-store
        '404':
          description: 没有可用的当前文件。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: -3001
                message: Log file snapshot is unavailable
                data: null
          headers: {}
        '429':
          description: 文件下载连接配额已满。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: -3001
                message: Download connection limit reached
                data: null
          headers:
            Retry-After:
              required: false
              description: 建议等待秒数，当前为 5。
              schema:
                type: integer
                example: 5
        '500':
          description: 正文开始前读取快照失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: -3001
                message: Cannot read log file snapshot
                data: null
          headers: {}
        '503':
          description: 诊断服务停止中，或快照超时/存储不可用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: -3001
                message: Log file snapshot is unavailable
                data: null
          headers: {}
      security: []
      servers:
      - url: http://{host}:{diagnosticsPort}
        variables:
          host:
            default: 127.0.0.1
          diagnosticsPort:
            default: '8082'
