  /api/arms/{arm}/robot/disable:
    post:
      summary: 指定臂：下电 / 关闭使能
      deprecated: false
      description: '双臂扩展（本地已实现）：本请求只作用于 URL 中指定的 arm，保持另一臂的控制权及运动状态。

        同一臂的状态切换需串行保护；不同臂的请求不得因持有一个全局运动锁而相互等待。

        成功字段及单位继承下述单臂契约；业务失败检查 success/code/message，不以 HTTP 200 判断成功。

        返回后通过该臂状态确认终态；不把重复请求一律视为成功，保留单臂状态机对非法状态的拒绝。


        继承的单臂契约：

        需要 HTTP 控制权。RCI 待命可直接下使能，转入 IDLE 并关闭 RCI。活动 RCI 会话先进入 STOPPING，停止完成后 DISABLING → IDLE。停止或下使能失败进入
        ERROR_STATE 并关闭 RCI。请求返回后通过状态查询确认终态。'
      tags:
      - 按臂基础控制
      parameters: []
      responses:
