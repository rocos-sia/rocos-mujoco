# Local dual-arm implementation contract; not published to online Apifox.
openapi: 3.1.0
info:
  title: ROCOS DualArm API — 独立双臂控制
  version: 0.4.1-local
  description: '本文件对应 rocos-app 的 dualarm 分支本地实现，可作为独立 OpenAPI YAML 导入 Apifox。

    rocosDualArmMain 已提供本文件列出的路由；尚未发布到在线 Apifox，不替代在线 ROCOS API 的单臂契约。

    文档版本独立于 App/MuJoCo 产品版本、共享内存 ABI 及上游 API 版本。

    肩部试验配置 app_shoulder.yaml：左/右求解基坐标分别为 left_base/right_base；原 app.yaml 仍为公共 base_link。
    BASE 和 reference_frame=base 均指当前臂配置中的 base_link，应从 /api/arms 或 /api/workcell/model 确认，不能由端口推断。
    试验版仅平移原点：旧公共基座到左肩的平移为 [0.011578,-0.063,0.091501] m，到右肩为 [0.011578,-0.267,0.091501] m，轴方向不变。
    旧基座表达的位置需减去相应偏移，方向不变；不自动转换旧目标、工件坐标或持久化文件。法兰相对 TCP/工具安装/负载质心不做该平移。
    MoveJ_IK 当前接收求解基坐标下的法兰目标；MoveL 接收求解基坐标下的所选工具目标。两者不可混用。
    接口格式保持不变，不增加 WORLD 输入或跨臂目标自动转换。


    目标：一个 rocosDualArmMain 进程、一个 HTTP 监听端口、一份双臂入口配置、两个独立 Robot。

    左右分别绑定 ecat_id=0/1（当前仿真配置），各自持有状态机、控制循环和运动任务。

    可并行提交左右命令；请求到达顺序不构成同步启动、共同结束或同周期执行承诺。

    两个状态接口各自返回单臂快照，不能将连续读取解释为一个原子的双臂快照；timestamp 沿用上游 epoch seconds 定义。

    本版不提供双臂联合轨迹、批量运动、全局停止接口，也不提供跨臂碰撞规划或进程级故障隔离。


    路由规则：将已选中的单臂 /api/... 接口映射为 /api/arms/{arm}/...，arm 必须为 left 或 right。

    保留单臂请求体、成功响应及单位；/api/arms 是新增的实例清单接口。

    双臂服务不把无 arm 的单臂路径默认转发给任一臂；缺失臂或不存在的路径返回 HTTP 404。

    对结构正确但 arm 值非法的已知路径，返回 HTTP 200、success=false、code=1001，且不调用任何 Robot。

    未知路径的 JSON 404 响应为双臂路由层新增约定，示例见 x-routing-errors。


    控制权按臂隔离：每臂分别 acquire、heartbeat、release，token 仅对签发它的臂有效。

    同一 client_id 可持有左右两个独立 token；客户端须分别保存并续期。

    使用现有 X-Rocos-Control-Token 与 X-Rocos-Client-Id 请求头。

    本版不开放共享 debug-token 旁路或强制接管接口；读接口不续期，控制权 TTL 与运动完成不能混为一谈。

    仅复制上游对应接口的鉴权要求；未来接入 RCI 时必须单独遵循其在线协议，不可机械套用所有写接口均需 token 的假设。


    响应规则：继承的业务失败可仍返回 HTTP 200，必须检查 success、code、message。

    成功响应 schemas 来自在线 ROCOS API；双臂路由/鉴权失败通过新增 DualArmBusinessError 分支显式补全。

    MoveJ 成功表示受理；用该臂 state/move_status 确认执行状态，并结合实际反馈检查到位。

    仿真下使能期间关节可能漂移；重新使能后须等待 STOPPED 和反馈速度持续稳定再发 MoveJ。使能受理不表示物理反馈已稳定，立即下发曾触发核心 SpeedLimit 保护。

    不要对超时的运动 POST 自动重试：请求可能已被受理，本版未引入幂等键。


    运行边界：启动前校验两份配置，两个 Robot 均初始化成功后才开放 HTTP，默认下使能。

    任一初始化失败则释放已创建资源并退出；运行中的单臂请求错误不会自动操作另一臂。

    共享资源失效、应用退出属于共同故障；退出流程须停止接单、请求停止和下使能、等待线程结束后释放资源。

    同一 ecat_id 只允许一个实际控制端；不得与现有单臂 App 同时控制主站 0/1。


    第一版仅提供本文件 paths 列出的接口。组件中保留上游状态里的工具/RCI 字段，不表示已开放工具包、脚本、RCI、UDP 或 DDS 控制接口。


    扩展版提供点动、MoveJ_IK/MoveL/MoveL_FK、模型下载、普通坐标系与负载管理。模型为共享只读资源；写请求仍按臂隔离。工具包、重命名、任意路径持久化、脚本、RCI/DDS、联合运动不在本版范围。



    六点工具标定：双臂本地实现：支持普通工具和已配置工具包的六点标定。P1 固定工具包摘要及安装 revision，后续采点、计算、保存遇到变更或移除返回 4004 并清除旧解。保存仅接受 session_id，工具包局部
    TCP=mount.Inverse()*result.pose；保留 mount、包版本、摘要与原包资源。原子保存到本臂 frames 文件，写入时间、robot_id、安装与误差等标定记录；不自动激活。成功后会话跟随新
    revision；失败保留原注册表。每臂最多 16 个会话，绑定创建者 token，重启、淘汰或本臂成功 frames/load 后失效。读接口不续期。显式提交 pose/flange/joints
    样本字段返回 1001。


    本地日志扩展：/api/dualarm/logs 与 /api/dualarm/logs/stream 位于独立诊断服务 8082；原 /api/logs 告警格式保持不变。/api/logs/file/latest
    返回当前进程文件快照，双臂模式文件行含 arm/ecat_id；轮转历史不在本接口范围。仅更新此本地 YAML，未发布在线 Apifox。'
servers:
- url: http://127.0.0.1:8080
  description: 双臂 HTTP 默认地址；需先启动 MuJoCo 和 rocosDualArmMain
tags:
- name: 双臂实例
  description: 实例枚举，不聚合运动命令
- name: 按臂状态
  description: 指定臂的状态、信息和运动查询
- name: 按臂控制权
  description: 每臂独立租约，复用上游 token/client_id 规则
- name: 按臂基础控制
  description: 指定臂的使能、下使能及复位
- name: 按臂运动
  description: 指定臂的 MoveJ 与运动生命周期
- name: 按臂六点标定
  description: 普通工具与已配置工具包 TCP，采集、计算、回读及明确保存
- name: 日志与诊断
security: []
x-development-status: local-implementation
x-derived-from:
  authority: Apifox MCP project ROCOS API
  title: ROCOS API
  api_version: 3.0.0
  download_time: '2026-11-17T14:26:39.434Z'
  calibration_download_time: '2026-11-17T15:02:30.221Z'
  note: 继承内容来自在线规范。新增 arm 路由、实例枚举、错误分支及生命周期由独立双臂入口实现；导入和发布后需重新核对在线版本。
x-implementation-boundaries:
  repository: rocos-app
  branch: dualarm
  build_option: ROCOS_BUILD_DUALARM
  default_enabled: false
  executable: rocosDualArmMain
  core_link_target: rocos::robot
  new_directory: dualarm/
  single_arm_compatibility: 保留 rocosAppMain、src/rocosAppMain.cpp、原有 AppConfig/HTTP 服务和 /api/... 单臂路由；顶层
    CMake 仅条件引入双臂子目录。
  reuse_boundary: 复用 Robot C++ API 和运动核心；双臂自有薄 HTTP 适配层，不要求先重构 RobotHttpServer，不复制规划器或控制算法。 工具包标定新增只读
    Robot::GetToolPackage 和受状态门闩保护的 SaveToolCalibration；原单臂 HTTP 不变。
  configuration: 独立 DualArmConfig，arms.left/right.config 引用现有单臂 app 配置；复用 AppConfig::load/资源校验。只有顶层启动
    HTTP、诊断和进程日志服务；子配置用于 Robot 及设备资源。 可选 workcell.urdf/asset_root 配置共用模型快照；此版本必须与两臂完整 URDF 一致。
  config_checks:
  - 两个 arm 均存在
  - ecat_id 非负且不同
  - 设备 ID 不同
  - 模型/硬件/主站周期匹配
  - 帧、负载、工具安装及快照的可写路径按臂隔离
  - 两臂处于同一 MuJoCo 世界时关节绑定不重叠
  - 顶层 HTTP 与诊断端口不同
  scope_after_v1:
  - 工具包导入/导出等管理
  - 工具重命名
  - 脚本
  - RCI/UDP
  - DDS
  - 双臂同步与避碰
x-routing-errors:
  unknown_path:
    http_status: 404
    body:
      success: false
      code: 1001
      message: Unknown dual-arm API path
      data: null
  invalid_arm:
    http_status: 200
    body:
      success: false
      code: 1001
      message: arm must be left or right
      data: null
paths:
  /api/arms:
    get:
      summary: 列出本进程管理的左右机械臂
      operationId: dualarm_list_arms
      tags:
      - 双臂实例
      security: []
      x-implementation-status: implemented-local
      description: 仅返回实例身份与路由信息；不获取控制权、不续期，不代表两臂当前均可运动。实时状态分别查询各臂 state。
      responses:
        '200':
          description: 双臂实例清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArmsResponse'
              example:
                success: true
                code: 0
                message: ok
                data:
                  execution_mode: independent
                  arms:
                  - arm: left
                    device_id: dualarm_sim_left
                    ecat_id: 0
                    joint_count: 7
                    api_prefix: /api/arms/left
                  - arm: right
                    device_id: dualarm_sim_right
                    ecat_id: 1
                    joint_count: 7
                    api_prefix: /api/arms/right
          headers:
            X-Rocos-Request-Id:
              description: 本次双臂 HTTP 请求标识。操作事件可用它定位；不是异步运动 task_id。
              schema:
                type: string
  /api/arms/{arm}/robot/state:
    get:
      summary: 指定臂：获取机器人完整状态快照
      deprecated: false
      description: '双臂扩展（本地已实现）：本请求只作用于 URL 中指定的 arm，保持另一臂的控制权及运动状态。

        同一臂的状态切换需串行保护；不同臂的请求不得因持有一个全局运动锁而相互等待。

        成功字段及单位继承下述单臂契约；业务失败检查 success/code/message，不以 HTTP 200 判断成功。

        返回目标臂的 RobotStateData；左右状态分别采样。保留上游 rci/tool 字段，仅表示状态格式兼容，不表示第一版提供对应控制接口。


        继承的单臂契约：

        包含 FSM 状态、关节数据、法兰位姿、实时 TCP、当前工具固定偏置、工件系及硬件摘要。tcp 为基座到当前 TCP，与 flange 使用同一关节采样并与活动工具使用同一注册表快照；无活动工具时
        tcp=flange，FK/反馈无效时 tcp=null。flange 继续表示基座到法兰，active_tool_frame 继续表示法兰到工具的固定偏置。只读、不要求控制权、不续期。
        active_tool_package 为当前工具包安装与模型元信息（普通工具为 null），模型使用 flange*mount，tcp 使用 flange*mount*局部tcp；三者来自同一注册表快照。


        当前实现增加 data.rci，内容与 /api/robot/rci/status 的 data 一致。RCI 状态在处理请求时另行读取，其采样时刻可能与其余机器人状态快照存在差异。


        robot_state 枚举新增 RCI。FSM 状态、control_active、motion_busy 和 rci 来自同一次受锁读取。RCI 待命 control_active=true、motion_busy=false、rci.control_active=false。关节反馈和周期伺服诊断沿用各自采样语义。'
      tags:
      - 按臂状态
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                anyOf:
                - allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RobotStateData'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          rci:
                            $ref: '#/components/schemas/RciStatusData'
                - $ref: '#/components/schemas/DualArmBusinessError'
              examples:
                invalidArm:
                  summary: 无效的臂标识；任何 Robot 均未被调用
                  value:
                    success: false
                    code: 1001
                    message: arm must be left or right
                    data: null
          headers:
            X-Rocos-Request-Id:
              description: 本次双臂 HTTP 请求标识。操作事件可用它定位；不是异步运动 task_id。
              schema:
                type: string
      security: []
      operationId: dualarm_get_robot_state
      x-implementation-status: implemented-local
      x-upstream-path: /api/robot/state
    parameters:
    - $ref: '#/components/parameters/Arm'
  /api/arms/{arm}/robot/info:
    get:
      summary: 指定臂：获取机器人与控制器信息
      deprecated: false
      description: '双臂扩展（本地已实现）：本请求只作用于 URL 中指定的 arm，保持另一臂的控制权及运动状态。

        同一臂的状态切换需串行保护；不同臂的请求不得因持有一个全局运动锁而相互等待。

        成功字段及单位继承下述单臂契约；业务失败检查 success/code/message，不以 HTTP 200 判断成功。


        继承的单臂契约：

        读取软件、机器人模型、主站/ECM、从站清单和既有关节配置的信息基线。只读、无需控制权，不刷新控制权 TTL。连接/切换控制器时读取，可手动刷新，不作为高频状态流。


        当前 App 固定返回 info_schema_version=2 及全部扩展键；未接入项为 null，分组 source=placeholder。slaves 由驱动配置生成，不是扫描结果；slaves_complete=false。旧
        App 仅返回 joint_infos 时 Viz 仍可连接并提示扩展信息未提供。将来用真实采集值替换占位值时保持 key、类型、单位和来源语义不变。 v2 将 joint_infos.cnt_per_unit
        更名为 pos_per_unit，增加 vel_per_unit 与 load_torque_per_unit，客户端需要迁移。'
      tags:
      - 按臂状态
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                anyOf:
                - allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RobotInfoData'
                - $ref: '#/components/schemas/DualArmBusinessError'
              examples:
                invalidArm:
                  summary: 无效的臂标识；任何 Robot 均未被调用
                  value:
                    success: false
                    code: 1001
                    message: arm must be left or right
                    data: null
          headers:
            X-Rocos-Request-Id:
              description: 本次双臂 HTTP 请求标识。操作事件可用它定位；不是异步运动 task_id。
              schema:
                type: string
      security: []
      operationId: dualarm_get_robot_info
      x-implementation-status: implemented-local
      x-upstream-path: /api/robot/info
    parameters:
    - $ref: '#/components/parameters/Arm'
  /api/arms/{arm}/robot/enable:
    post:
      summary: 指定臂：使能机器人
      deprecated: false
      description: '双臂扩展（本地已实现）：本请求只作用于 URL 中指定的 arm，保持另一臂的控制权及运动状态。

        同一臂的状态切换需串行保护；不同臂的请求不得因持有一个全局运动锁而相互等待。

        成功字段及单位继承下述单臂契约；业务失败检查 success/code/message，不以 HTTP 200 判断成功。

        返回后通过该臂状态确认终态；不把重复请求一律视为成功，保留单臂状态机对非法状态的拒绝。


        继承的单臂契约：

        '
      tags:
      - 按臂基础控制
      parameters: []
      responses:
        '200':
          description: 使能成功
          content:
            application/json:
              schema:
