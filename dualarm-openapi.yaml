            default: '8082'
  /api/logs/stream:
    get:
      summary: 实时订阅控制器日志（SSE）
      deprecated: false
      description: '独立诊断服务，默认 `http://控制器地址:8082`，端口由启动配置 `diagnostics.port` 指定。无需控制权或身份头，不会续期控制权。支持跨域
        GET/OPTIONS；开发时应将 `/api/logs` 及其子路径代理到诊断端口。


        成功响应是长期保持的 text/event-stream 文本流，不是 JSON 响应封装。仅推送 warn/error/critical 和缺口通知。


        不传游标只订阅后续记录；提供 after 或 Last-Event-ID 会先重放尚在缓存内的后续帧，再推送新记录。Last-Event-ID 头存在时优先于 after 查询参数，包括显式空头。使用原生
        EventSource 自动重连时浏览器会发送 Last-Event-ID。


        `event: log` 的 data 为 ControllerLogEvent JSON，并带 id 字段；`event: gap` 的 data 为 ControllerLogGap
        JSON，无事件 id。重启、缓存淘汰、生产端溢出和慢客户端覆盖会产生 gap；客户端需提示可能丢失日志，并按日志 id 去重。连接开始发送 `: connected` 注释，空闲约 15
        秒发送 `: heartbeat`。


        默认最多同时 4 个 SSE 客户端，可由 diagnostics.max_sse_clients 配置（1–64）；超额返回 429 和 Retry-After: 5。响应头 X-Rocos-SSE-Limit
        给出配置的上限；代理需关闭缓冲并允许长连接。响应开始前参数错误为 400，停止中为 503；开始后故障通过断开连接体现。'
      tags:
      - 日志与诊断
      parameters:
      - name: after
        in: query
        description: 续传游标，Last-Event-ID 头优先。
        required: false
        schema:
          type: string
          maxLength: 128
          pattern: ^([A-Za-z0-9-]+:[0-9]+)?$
          description: 不透明游标 session:sequence；使用上次返回的 next_id 或 SSE id，不要自行拼接。
      - name: Last-Event-ID
        in: header
        description: 原生 SSE 重连游标，优先于 after；最多 128 字符。
        required: false
        example: ''
        schema:
          type: string
          maxLength: 128
          pattern: ^([A-Za-z0-9-]+:[0-9]+)?$
          description: 不透明游标 session:sequence；使用上次返回的 next_id 或 SSE id，不要自行拼接。
      responses:
        '200':
          description: SSE 流，log/gap 命名事件的 data 为 JSON。
          content:
            text/event-stream:
              schema:
                type: string
              example: ': connected


                id: a1b2c3-1234:1

                event: log

                data: {"id": "a1b2c3-1234:1", "timestamp": "2026-10-23T17:10:16.001+08:00", "level": "warn",
                "module": "Hardware", "code": -2310, "message": "Joint 1 velocity exceeded the limit."}


                event: gap

                data: {"reason":"buffer_overrun","earliest_id":"a1b2c3-1234:2"}


                : heartbeat


                '
          headers:
            X-Rocos-SSE-Limit:
              required: false
              description: 当前配置的 SSE 连接上限。
              schema:
                type: integer
                example: 4
            Cache-Control:
              required: false
              description: ''
              schema:
                type: string
                example: no-cache
            X-Accel-Buffering:
              required: false
              description: ''
              schema:
                type: string
                example: 'no'
        '400':
          description: 游标不合法。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: 1001
                message: Invalid log cursor
                data: null
          headers: {}
        '429':
          description: SSE 连接配额已满。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: -3001
                message: SSE connection limit reached
                data: null
          headers:
            Retry-After:
              required: false
              description: 建议等待秒数，当前为 5。
              schema:
                type: integer
                example: 5
        '503':
          description: 诊断服务正在停止。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: -3001
                message: Diagnostics service is stopping
                data: null
          headers: {}
      security: []
      servers:
      - url: http://{host}:{diagnosticsPort}
        variables:
          host:
            default: 127.0.0.1
          diagnosticsPort:
            default: '8082'
