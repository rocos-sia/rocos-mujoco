        schema:
          type: string
          maxLength: 128
          pattern: ^([A-Za-z0-9-]+:[0-9]+)?$
          description: 不透明游标 session:sequence；使用上次返回的 next_id 或 SSE id，不要自行拼接。
      - name: limit
        in: query
        description: 最大日志条数。
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        '200':
          description: 查询成功，JSON 封装。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerLogQueryResponse'
              example:
                success: true
                code: 0
                message: ok
                data:
                  events:
                  - id: a1b2c3-1234:1
                    timestamp: '2026-10-23T17:10:16.001+08:00'
