        name:
          type: string
          pattern: ^[A-Za-z0-9_.-]{1,64}$
        package_version:
          type: string
        digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740990
        urdf:
          type: string
          description: 包内 URDF 路径，可为空；资源通过 name+digest+path 查询
        mount:
          $ref: '#/components/schemas/Pose'
        tcp:
          $ref: '#/components/schemas/Pose'
        default_mount:
          $ref: '#/components/schemas/Pose'
        default_tcp:
          $ref: '#/components/schemas/Pose'
        calibration_yaml:
          type: string
          description: 本机标定记录 YAML，含时间、robot_id、包摘要、安装、法兰 TCP 与误差
      required:
      - name
      - package_version
      - digest
      - revision
      - urdf
      - mount
      - tcp
    RciServoSnapshot:
      type: object
      description: 来自当前伺服运动发布的周期快照及诊断。初始化阶段可返回零值，结合 cycle、sample_time_ns 和 output_valid 判断有效性。
      properties:
        cycle:
          type: integer
          minimum: 0
          description: 伺服控制周期序号
        sample_time_ns:
          type: integer
          minimum: 0
          description: 反馈采样的 steady_clock 单调时钟时间，单位 ns
        source_time_us:
          type: integer
          minimum: 0
          description: 硬件反馈源时间，单位 us，具体来源由硬件实现决定
        received_message_id:
          type: integer
          minimum: 0
          description: 最近接受的运动指令序号
        applied_message_id:
          type: integer
          minimum: 0
          description: 最近成功提交硬件接口的参考所对应的指令序号
        fault_code:
          type: integer
          description: 伺服故障或停止原因的原始 Result 整数，0 表示无错误
        errors:
          type: array
          minItems: 41
          maxItems: 41
          items:
            type: boolean
          description: 索引 0 为任意伺服故障，1 为首点错误，2 为通信错误，3 为运动约束错误，4..40 保留。
        q:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: number
          description: 采样的实际关节位置，单位 rad。数组固定 10 项，使用前实际自由度项。
        dq:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: number
          description: 采样的实际关节速度，单位 rad/s。数组固定 10 项，使用前实际自由度项。
        q_d:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: number
          description: 伺服信号处理后的关节参考位置，单位 rad。数组固定 10 项，使用前实际自由度项。
        dq_d:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: number
          description: 伺服信号处理后的关节参考速度，单位 rad/s。数组固定 10 项，使用前实际自由度项。
        ddq_d:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: number
          description: 伺服信号处理后的关节参考加速度，单位 rad/s²。数组固定 10 项，使用前实际自由度项。
        q_cmd:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: number
          description: 最终控制输出中的关节位置字段，单位 rad，结合 output_mode 和 output_valid 解读。数组固定 10 项，使用前实际自由度项。
        tau_cmd:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: number
          description: 最终控制输出中的力矩字段，单位 Nm，结合 output_mode 和 output_valid 解读。数组固定 10 项，使用前实际自由度项。
        output_mode:
          type: integer
          description: 硬件控制输出模式的原始枚举整数
        output_valid:
          type: boolean
          description: 本周期输出成功提交硬件接口且未请求安全停止。驱动实际执行结果需结合反馈判断。
        control_command_success_rate:
          type: number
          minimum: 0
          maximum: 1
          description: 最近至多 100 个控制周期收到新运动指令的比例。查询包、重复包和乱序包不计成功。此字段统计接收质量，驱动执行情况由实际反馈反映。
        control_cycles:
          type: integer
          minimum: 0
          description: 本会话通信统计记录的控制周期总数
        elapsed_periods:
          type: integer
          minimum: 0
          description: 累计经过的控制周期数，由 elapsed_ns 与硬件周期计算，累计保留不足一周期的余量
      required:
      - cycle
      - sample_time_ns
      - source_time_us
      - received_message_id
      - applied_message_id
      - fault_code
      - errors
      - q
      - dq
      - q_d
      - dq_d
      - ddq_d
      - q_cmd
      - tau_cmd
      - output_mode
      - output_valid
      - control_command_success_rate
      - control_cycles
      - elapsed_periods
