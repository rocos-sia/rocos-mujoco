        heartbeat 不记操作事件；失败心跳会记录。点动续发仍逐次记录，长时间运行可能覆盖内存历史；文件保留取决于 logging 配置。未知臂归属 process。请求结果不是运动完成：后台
        Robot 状态、CycleFinished/失败消息单独反馈，不提供请求到任务完成的关联。


        独立诊断服务，默认 `http://控制器地址:8082`，端口由启动配置 `diagnostics.port` 指定。无需控制权或身份头，不会续期控制权。支持跨域 GET/OPTIONS；开发时应将
        `/api/dualarm/logs` 及其子路径代理到诊断端口。


        成功响应是长期保持的 text/event-stream 文本流，不是 JSON 响应封装。推送 info/warn/error/critical 和缺口通知。


        不传游标只订阅后续记录；提供 after 或 Last-Event-ID 会先重放尚在缓存内的后续帧，再推送新记录。Last-Event-ID 头存在时优先于 after 查询参数，包括显式空头。使用原生
        EventSource 自动重连时浏览器会发送 Last-Event-ID。


        `event: log` 的 data 为 DualArmLogEvent JSON，并带 id 字段；`event: gap` 的 data 为 ControllerLogGap JSON，无事件
        id。重启、缓存淘汰、生产端溢出和慢客户端覆盖会产生 gap；客户端需提示可能丢失日志，并按日志 id 去重。连接开始发送 `: connected` 注释，空闲约 15 秒发送 `: heartbeat`。


        默认最多同时 4 个 SSE 客户端，可由 diagnostics.max_sse_clients 配置（1–64）；超额返回 429 和 Retry-After: 5。响应头 X-Rocos-SSE-Limit
        给出配置的上限；代理需关闭缓冲并允许长连接。响应开始前参数错误为 400，停止中为 503；开始后故障通过断开连接体现。


        SSE event: log 的 data 为 DualArmLogEvent；event: gap 的 data 为 ControllerLogGap。与旧流共享 max_sse_clients
        配额。'
      tags:
      - 日志与诊断
      parameters:
      - name: after
        in: query
        description: 续传游标，Last-Event-ID 头优先。
        required: false
        schema:
          type: string
          maxLength: 128
          pattern: ^([A-Za-z0-9-]+:[0-9]+)?$
          description: 不透明游标 session:sequence；使用上次返回的 next_id 或 SSE id，不要自行拼接。
      - name: Last-Event-ID
        in: header
        description: 原生 SSE 重连游标，优先于 after；最多 128 字符。
        required: false
        example: ''
        schema:
          type: string
          maxLength: 128
          pattern: ^([A-Za-z0-9-]+:[0-9]+)?$
          description: 不透明游标 session:sequence；使用上次返回的 next_id 或 SSE id，不要自行拼接。
      responses:
        '200':
          description: SSE 流，log/gap 命名事件的 data 为 JSON。
          content:
            text/event-stream:
              schema:
                type: string
          headers:
            X-Rocos-SSE-Limit:
              required: false
              description: 当前配置的 SSE 连接上限。
              schema:
                type: integer
                example: 4
            Cache-Control:
              required: false
              description: ''
              schema:
                type: string
                example: no-cache
            X-Accel-Buffering:
              required: false
              description: ''
              schema:
                type: string
                example: 'no'
        '400':
          description: 游标不合法。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: 1001
                message: Invalid log cursor
                data: null
          headers: {}
        '429':
          description: SSE 连接配额已满。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: -3001
                message: SSE connection limit reached
                data: null
          headers:
            Retry-After:
              required: false
              description: 建议等待秒数，当前为 5。
              schema:
                type: integer
                example: 5
        '503':
          description: 诊断服务正在停止。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: -3001
                message: Diagnostics service is stopping
                data: null
          headers: {}
      security: []
      servers:
      - url: http://{host}:{diagnosticsPort}
        variables:
          host:
            default: 127.0.0.1
          diagnosticsPort:
            default: '8082'
components:
  parameters:
    Arm:
      name: arm
      in: path
      required: true
      description: 目标机械臂，必须显式指定。left/right 对应双臂入口配置中的实例键，不是从站 ID；禁止默认选臂。
      schema:
        type: string
        enum:
        - left
        - right
      examples:
        left:
          summary: 左臂
          value: left
        right:
          summary: 右臂
          value: right
  schemas:
    StandardResponse:
      type: object
      required:
      - success
      - code
      - message
      properties:
        success:
          type: boolean
        code:
          type: integer
          description: '业务状态码。0: 成功, 1xxx: 参数错误, 2xxx: 运动/规划错误, 3xxx: 状态错误, 4xxx: 标定错误, 5xxx: 异步任务错误,
            -6xxx: Lua 错误

            '
        message:
          type: string
        data:
          type:
          - object
          - 'null'
          properties: {}
    RobotStateData:
      type: object
      properties:
        robot_state:
          type: string
          enum:
          - IDLE
          - ENABLING
          - DISABLING
          - STARTING
          - STOPPING
          - PAUSING
          - RESUMING
          - RESETTING
          - RUNNING
          - PAUSED
          - STOPPED
          - SERVOING
          - ERROR_STATE
          - RCI
        work_mode:
          type: string
          enum:
          - position
          - ee_admit_teach
          - jnt_admit_teach
          - jnt_imp
          - cart_imp
          description: 当前工作模式
        is_enabled:
          type: boolean
        is_running:
          type: boolean
        control_active:
          type: boolean
          description: 控制循环是否活跃，RCI 待命为 true。
        motion_busy:
          type: boolean
          description: 是否存在活动运动，RCI 待命为 false。
        timestamp:
          type: number
          description: 快照时刻 (epoch seconds)
        joint_states:
          type: array
          items:
            $ref: '#/components/schemas/JointState'
        flange:
          $ref: '#/components/schemas/Pose'
          description: 基座到法兰的实时位姿，保持原语义，不叠加工具偏置。
        active_tool_frame_name:
          type: string
        active_tool_frame:
          $ref: '#/components/schemas/Pose'
          description: 法兰到当前工具的固定偏置；不是基座到 TCP 的实时位姿。
        active_object_frame_name:
          type: string
        active_object_frame:
          $ref: '#/components/schemas/Pose'
        hw_state:
          $ref: '#/components/schemas/HardwareState'
        tcp:
          oneOf:
          - $ref: '#/components/schemas/Pose'
            description: 基座到当前 TCP 的实时位姿，使用与 flange 相同的关节采样及同一工具注册表快照；无活动工具时等于 flange，FK/反馈无效时为 null。缺少此字段表示旧版
              App。
          - type: 'null'
        active_tool_package:
          oneOf:
          - $ref: '#/components/schemas/ToolPackageData'
            description: 当前包工具的摘要、版本、安装 M、局部 TCP C、revision 和 URDF 路径，与 tcp 使用同一注册表快照；普通工具或无工具为 null。省略
              default_mount/default_tcp 和 calibration_yaml。模型为 flange*M，实时 TCP 为 flange*M*C。旧 App 缺省此字段。
          - type: 'null'
        rci:
          $ref: '#/components/schemas/RciStatusData'
    RciStatusData:
      type: object
      description: RCI 入口、活动会话、机器人状态和伺服诊断。
      properties:
        enabled:
          type: boolean
          description: RCI 模式占用运动入口，包括待命、伺服及关闭中的互斥阶段。故障自动置 false。
        closing:
          type: boolean
          description: 正在关闭 RCI，等待活动运动完成停止
        control_active:
          type: boolean
          description: RCI 会话仍处于执行或受控停止生命周期。待命为 false，与顶层控制循环活跃含义不同。
        robot_state:
          type: string
          description: 当前 FSM 状态，包含独立 RCI 待命态。
        last_control:
          anyOf:
          - $ref: '#/components/schemas/RciServoSnapshot'
          - type: 'null'
          description: 最近进入停止或故障状态时保存的伺服快照，初始为 null。快照也可能来自普通 servo 会话。
        current_control:
          $ref: '#/components/schemas/RciServoSnapshot'
          description: 当前 motion 为 MoveServo 时提供，包括停止或故障处理阶段。该字段的存在与 control_active 应分别解读。
      required:
      - enabled
      - closing
      - control_active
      - robot_state
      - last_control
    RobotInfoData:
      type: object
      properties:
        info_schema_version:
          type: integer
          description: 本响应信息模型版本，当前为 2。v2 将 joint_infos.cnt_per_unit 更名为 pos_per_unit，增加 vel_per_unit
            与 load_torque_per_unit。v1 使用旧字段；缺省表示更早响应。新增可选字段不升版，破坏性调整须升级。
          enum:
          - 2
        controller:
          type: object
          description: 控制器软件信息。
          properties:
            app_version:
              type: string
              description: App 编译版本（含预发布标识）。当前已接入真实编译值。
            build_commit:
              type:
              - string
              - 'null'
              description: App 构建对应 Git 提交；未知为 null。
            api_version:
              type: string
              description: Apifox API 契约版本，与 App 版本及 info_schema_version 独立；当前 3.0.0。
            shm_abi_version:
              type: integer
              description: App 编译采用的共享内存 ABI 版本；不表示已与主站完成握手。
              minimum: 1
            capabilities:
              type: array
              items:
                type: string
              description: App 明确声明的能力，非完整功能清单。当前包含 robot_info_v2，表示 joint_infos 使用四个独立单位变换字段；未列出的能力不可推断为不支持。
          required:
          - app_version
          - build_commit
          - api_version
          - shm_abi_version
          - capabilities
        robot:
          type: object
          description: 机器人身份与模型元数据。当前 source=placeholder，其余未知字段为 null，mass_complete=false。Viz 现有 URDF
            统计独立保留。
          properties:
            source:
              type: string
              description: 数据来源：placeholder 尚未接入；configuration 配置文件；runtime 运行时读取。
              enum:
              - placeholder
              - configuration
              - runtime
            name:
              type:
              - string
              - 'null'
              description: 机器人模型名称。
            package_version:
              type:
              - string
              - 'null'
              description: 机器人模型包版本。
            device_id:
              type:
              - string
              - 'null'
              description: 机器人设备标识，用于本机配置关联；与产品序列号不同。
            serial_number:
              type:
              - string
              - 'null'
              description: 机器人序列号，保留前导零。
            dof:
              type:
              - integer
              - 'null'
              description: 机器人运动自由度；未知为 null。
              minimum: 0
            base_link:
              type:
              - string
              - 'null'
              description: 运动学链基座 link 名。
            tip_link:
              type:
              - string
              - 'null'
              description: 运动学链末端/法兰 link 名。
            model_digest:
              type:
              - string
              - 'null'
              description: 模型包内容摘要，未来接入时采用 sha256:<64 位小写十六进制>；未知为 null。
              pattern: ^sha256:[a-f0-9]{64}$
            link_count:
              type:
              - integer
              - 'null'
              description: 模型连杆总数。
              minimum: 0
            mass_kg:
              type:
              - number
              - 'null'
              description: 已知模型质量之和，单位 kg；未知为 null；仅 mass_complete=true 时表示总质量。
              minimum: 0
            mass_complete:
              type: boolean
              description: 所有相关连杆质量是否完整；尚未接入时为 false。
          required:
          - source
          - name
          - package_version
          - device_id
          - serial_number
          - dof
          - base_link
          - tip_link
          - model_digest
          - link_count
          - mass_kg
          - mass_complete
        master:
          type: object
          description: 主站/仿真后端信息。当前为 placeholder + unknown，其余为 null。
          properties:
            source:
              type: string
              description: 数据来源：placeholder 尚未接入；configuration 配置文件；runtime 运行时读取。
              enum:
              - placeholder
              - configuration
              - runtime
            backend:
              type: string
              description: 控制后端；unknown 表示尚未确定，不得把配置从站当成实际 ECM 连接。
              enum:
              - unknown
              - ecm
              - igh
              - mujoco
            version:
              type:
              - string
              - 'null'
              description: 主站程序版本；backend=ecm 时是 ECM 版本，其他后端是对应程序版本。
            sdk_version:
              type:
              - string
              - 'null'
              description: 主站使用的 SDK 版本（如 EC-Master SDK），与主站程序版本分开。
            master_id:
              type:
              - integer
              - 'null'
              description: 主站实例编号；0 是有效编号。
              minimum: 0
            cycle_time_us:
              type:
              - integer
              - 'null'
              description: 主站周期，单位微秒。
              minimum: 1
            configured_slave_count:
              type:
              - integer
              - 'null'
              description: 配置中的完整从站数量；未知为 null，不用当前不完整 slaves 数组长度代替。
              minimum: 0
          required:
          - source
          - backend
          - version
          - sdk_version
          - master_id
          - cycle_time_us
          - configured_slave_count
        slaves:
          type: array
          items:
            type: object
            description: 从站清单条目。当前仅由既有驱动配置生成（role=drive, source=configuration）；identity_source=unknown，身份/PDO
              字段为 null。不包含在线、WKC 等实时诊断状态。
            properties:
              id:
                type: integer
                description: 配置条目 ID；当前对应 drives[].id。不是已扫描的物理位置或 EtherCAT 地址。
              name:
                type:
                - string
                - 'null'
                description: 从站设备名称。
              joint_name:
                type:
                - string
                - 'null'
                description: 关联关节名称；非关节设备可为 null。
              role:
                type: string
                description: 设备用途。
                enum:
                - drive
                - ft_sensor
                - io
                - unknown
              source:
                type: string
                description: 数据来源：placeholder 尚未接入；configuration 配置文件；runtime 运行时读取。
                enum:
                - placeholder
                - configuration
                - runtime
              vendor_id:
                type:
                - integer
                - 'null'
                description: 厂家标识（十进制无符号 32 位数）。
                minimum: 0
                maximum: 4294967295
              product_code:
                type:
                - integer
                - 'null'
                description: 产品代码（十进制无符号 32 位数）。
                minimum: 0
                maximum: 4294967295
              revision_number:
                type:
                - integer
                - 'null'
                description: 设备硬件/产品修订号（十进制无符号 32 位数），与固件版本分开。
                minimum: 0
                maximum: 4294967295
              serial_number:
                type:
                - string
                - 'null'
                description: 设备序列号；采用字符串保留格式和前导零。
              firmware_version:
                type:
                - string
                - 'null'
                description: 从站固件版本。
              identity_source:
                type: string
                description: 身份字段来源：unknown 未获取；configuration 配置声明；device 实际设备回读。
                enum:
                - unknown
                - configuration
                - device
              input_pdo_count:
                type:
                - integer
                - 'null'
                description: 从站到主站方向的 PDO 映射条目数，不是字节数或 PDO 对象数。
                minimum: 0
              output_pdo_count:
                type:
                - integer
                - 'null'
                description: 主站到从站方向的 PDO 映射条目数，不是字节数或 PDO 对象数。
                minimum: 0
            required:
            - id
            - name
            - joint_name
            - role
            - source
            - vendor_id
            - product_code
            - revision_number
            - serial_number
            - firmware_version
            - identity_source
            - input_pdo_count
            - output_pdo_count
          description: 设备清单；当前仅配置驱动器。空数组不代表总线没有从站。
        slaves_complete:
          type: boolean
          description: 清单是否覆盖当前后端的全部从站；当前 false，不得据数组长度推断完整总线。
        joint_infos:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              pos_per_unit:
                type: number
                description: 位置码值/用户单位（rad 或 m），对应 hardware.yaml 的 transform.pos_per_unit，配置省略时为 1.0。返回实际生效值，必须有限且非零，允许负值表示方向反转。位置读回
                  = (raw_position - zero_offset) / pos_per_unit / ratio；下发采用逆变换并取整、校验限位。
              vel_per_unit:
                type: number
                description: 速度码值/(用户单位/s)，对应 transform.vel_per_unit；配置省略时继承当前驱动器 pos_per_unit。返回实际生效值，必须有限且非零。速度读回
                  = raw_velocity / vel_per_unit / ratio；下发采用逆变换，不应用位置零点。
              torque_per_unit:
                type: number
                description: 驱动器力矩码值/单位力矩（转动关节 N·m，移动关节 N），对应 transform.torque_per_unit，配置省略时为 1.0。返回实际生效值，必须有限且非零。驱动器力矩读回
                  = raw_torque / torque_per_unit；下发采用逆变换，不应用 ratio 或位置零点。
              load_torque_per_unit:
                type: number
                description: 负载力矩码值/单位力矩（转动关节 N·m，移动关节 N），对应 transform.load_torque_per_unit，配置省略时为 1.0。返回实际生效值，必须有限且非零。负载力矩读回
                  = raw_load_torque / load_torque_per_unit；torque_source 为 load_torque（int16 PDO）或 secondary_position（int32
                  PDO）均使用该比例，不应用位置零点、pos_per_unit 或 ratio。目前负载力矩只有读取接口；默认值不代表已完成传感器标定。
              ratio:
                type: number
              unit_name:
                type: string
              zero_offset:
                type: integer
            required:
            - pos_per_unit
            - vel_per_unit
            - torque_per_unit
            - load_torque_per_unit
          description: 驱动器关节配置及四个独立单位变换比例。v2 将 cnt_per_unit 更名为 pos_per_unit，并增加 vel_per_unit 与 load_torque_per_unit；torque_per_unit
            保留并明确含义。客户端应按 info_schema_version 识别字段集合。
      description: robot/info 信息基线 v2。保留 joint_infos；扩展键在新 App 中固定返回，旧 App 可以仅有 joint_infos。未知值为 null，不能用
        0/空字符串/示例版本冒充实测数据。当前只有 App 编译版本、编译 ABI、API 版本、能力标识和既有关节/驱动配置已接入；其余占位。 v2 的 joint_infos 返回 pos_per_unit、vel_per_unit、torque_per_unit、load_torque_per_unit，不再返回
        cnt_per_unit。
    MotionResponse:
      allOf:
      - $ref: '#/components/schemas/StandardResponse'
      - type: object
        properties:
          data:
            type: object
            properties:
              robot_state:
                type: string
              control_active:
                type: boolean
              motion_busy:
                type: boolean
                description: WaitMove 专用
    MoveStatusData:
      type: object
      properties:
        robot_state:
          type: string
        is_running:
          type: boolean
        control_active:
          type: boolean
        task_id:
          type: string
        task:
          type:
          - object
          - 'null'
          properties: {}
    ControlOwnerData:
      type: object
      properties:
        token:
          type: string
          description: 仅 acquire/takeover 成功时返回，心跳与查询不返回 token
        has_owner:
          type: boolean
        owner_ip:
          type: string
        owner_port:
          type: integer
          description: 申请控制权时的源端口，仅供审计，不用于身份校验
        owner_connection:
          type: string
          description: 申请时的 remote_addr:remote_port，仅供审计，不绑定 TCP 连接
        owner_client_id:
          type: string
          description: 稳定客户端会话 ID；浏览器端口变更时仍可保证同一前端会话继续持有 token
        owner_name:
          type: string
        owner_agent:
          type: string
          description: 客户端 User-Agent
        held_for_seconds:
          type: integer
          description: 自 acquire 起已持有的秒数
        idle_seconds:
          type: integer
          description: 自上次续期起的空闲秒数
        expires_in_seconds:
          type: integer
          description: 距离 TTL 到期的剩余秒数
        ttl_seconds:
          type: integer
          minimum: 1
          description: 控制权超时秒数，默认 300，http_control_ttl_seconds 必须为正整数；通过鉴权的写请求与心跳续期
        heartbeat_interval_seconds:
          type: number
          description: 建议心跳间隔，默认 5 秒；短 TTL 时不超过 TTL/3
        client_id:
          type: string
          description: 绑定的客户端身份，acquire/takeover 返回；后续写请求和心跳须通过请求头回传
        client_id_auto:
          type: boolean
          description: 服务端自动生成 client_id 时为 true
    JointState:
      type: object
      properties:
        id:
