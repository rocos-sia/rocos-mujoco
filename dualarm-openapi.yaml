  /api/arms/{arm}/calibration/pose:
    post:
      summary: 指定臂：采集六点法标定的真实法兰位姿
      deprecated: false
      description: '双臂本地实现：支持普通工具和已配置工具包的六点标定。P1 固定工具包摘要及安装 revision，后续采点、计算、保存遇到变更或移除返回 4004 并清除旧解。保存仅接受
        session_id，工具包局部 TCP=mount.Inverse()*result.pose；保留 mount、包版本、摘要与原包资源。原子保存到本臂 frames 文件，写入时间、robot_id、安装与误差等标定记录；不自动激活。成功后会话跟随新
        revision；失败保留原注册表。每臂最多 16 个会话，绑定创建者 token，重启、淘汰或本臂成功 frames/load 后失效。读接口不续期。显式提交 pose/flange/joints
        样本字段返回 1001。


        上游契约：

        写操作需要 X-Rocos-Control-Token 与 X-Rocos-Client-Id 同时存在，且状态为 IDLE/STOPPED；检查、文件提交与生效同运动启动互斥。code=1001
        参数无效，4005 状态不允许；其他文件和注册表错误沿用 Result 错误码。 仅从控制器采集静止时的真实关节/FK，不接受请求提供的 pose。P1–P4 为同一固定 TCP 的四种法兰姿态；P4
        是方向原点，保持 P4 方向沿期望工具 +X/+Z 移动后分别采集 P5/P6。重采集任何点立即清空 result。会话绑定创建者令牌、内存保留最多 16 个，重启失效；新会话首点必须 P1（4001），名称/索引无效
        1001，失效或其他令牌会话 4004，不能采集静止位姿 4005。 包工具会话固定摘要与安装 revision，变更后返回 4004，须重启采集；保存包工具必须使用 POST /api/calibration/save，由服务端反算局部
        TCP。'
      tags:
      - 按臂六点标定
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  pattern: ^[A-Za-z0-9_.-]{1,64}$
                  description: 工具名称，ASCII 字母、数字、下划线、点或短横，1–64 字符
                index:
                  type: integer
                  minimum: 1
                  maximum: 6
                session_id:
                  type: string
                  description: 首次 P1 省略以新建会话，其余点/重采集携带返回 ID
              required:
              - name
              - index
        required: true
      responses:
        '200':
          description: HTTP 200，检查 success/code；失败时 data 可为空
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/SixPointCalibrationResponse'
                - $ref: '#/components/schemas/DualArmBusinessError'
          headers:
            X-Rocos-Request-Id:
              description: 本次双臂 HTTP 请求标识。操作事件可用它定位；不是异步运动 task_id。
              schema:
                type: string
      security:
      - ControlToken: []
        ClientId: []
      operationId: dualArmCalibrationPose
      x-upstream-path: /api/calibration/pose
      x-implementation-status: implemented-local
    parameters:
    - $ref: '#/components/parameters/Arm'
