        info 以及 logging.file_level 允许的其他级别。


        文件每行格式 `[YYYY-MM-DD HH:mm:ss.SSS] [Module] [level] message`，保留文本空格和换行，不包含控制台 ANSI 颜色转义。浏览器预览可仅对
        [level] 着色；下载应保留原始文件内容。


        文件线程先 flush，再取得文件句柄与固定字节长度；X-Rocos-Log-Snapshot-Time 表示快照时间。快照之后追加的日志不属于本次下载，刷新会重新取快照。Content-Disposition
        提供服务端文件名。允许空文件快照。


        默认最多 1 个同时下载，可由 diagnostics.max_downloads 配置（1–16）；超额 429，Retry-After: 5。文件快照请求等待默认 250 ms，超时或存储不可用为
        503，无可用文件为 404，正文开始前读取失败为 500；发送开始后的错误仅表现为连接中断。'
      tags:
