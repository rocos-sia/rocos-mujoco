  securitySchemes:
    ControlToken:
      type: apiKey
      in: header
      name: X-Rocos-Control-Token
      description: '单持有者 HTTP 控制权令牌，由 acquire/takeover 获取。声明 ControlToken 鉴权的接口必须同时提供匹配的 X-Rocos-Client-Id。缺
        token 返回 3006，错误、过期或身份不匹配返回 3007。通过鉴权的控制请求与 heartbeat 续期。RCI enable/disable 需要 HTTP 控制权，RCI start/stop/status
        按各接口 security 声明接入。

        双臂扩展：与 URL 中的 arm 绑定；左右租约独立校验。'
    ClientId:
      type: apiKey
      in: header
      name: X-Rocos-Client-Id
      description: '与申请 HTTP 控制权时绑定的 client_id 一致。接口声明 ControlToken 鉴权时，同时提供匹配的 ClientId。

        双臂扩展：与 URL 中的 arm 绑定；左右租约独立校验。'
