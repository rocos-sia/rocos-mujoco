                    module: Hardware
                    code: -2310
                    message: Joint 1 velocity exceeded the limit.
                  next_id: a1b2c3-1234:1
                  has_more: false
                  gap: null
          headers: {}
        '400':
          description: 参数或游标不合法。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: 1001
                message: limit must be in [1, 500]
                data: null
          headers: {}
        '503':
          description: 诊断服务正在停止。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: -3001
                message: Diagnostics service is stopping
                data: null
          headers: {}
      security: []
      servers:
      - url: http://{host}:{diagnosticsPort}
        variables:
          host:
            default: 127.0.0.1
