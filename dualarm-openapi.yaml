      deprecated: false
      description: '独立诊断服务，默认 `http://控制器地址:8082`，端口由启动配置 `diagnostics.port` 指定。无需控制权或身份头，不会续期控制权。支持跨域
        GET/OPTIONS；开发时应将 `/api/logs` 及其子路径代理到诊断端口。


        查询当前 App 进程的内存缓存，只包含 warn/error/critical，不读取磁盘文件，普通 info 请使用最新文件接口。缓存上限为 4096 帧或约 16 MiB，先到者触发淘汰；重启后旧进程记录不保留。


        不传 after 时取最近 limit 条，按旧到新返回；传 after 时返回该游标之后的记录。limit 默认 100，范围 1–500。has_more=true 时可继续以 next_id
        分页；随后用 next_id 订阅实时流，客户端按 id 去重。旧会话游标会返回 gap.reason=server_restarted；缓存覆盖为 buffer_overrun；生产队列丢失为
        producer_overflow。游标格式错误、超过 128 字符、同会话游标超前、limit 非整数或越界均为 HTTP 400。'
      tags:
      - 日志与诊断
      parameters:
      - name: after
        in: query
        description: 不透明游标 session:sequence；使用上次返回的 next_id 或 SSE id，不要自行拼接。
