# 启动配置。默认读取工作目录的 config/config.yaml。
# 指定其他配置：rocos_mujoco_sim --config /path/to/config.yaml
model: ../models/talon/scene.xml   # 直接指定 MJCF 文件，也支持 URDF
# 支持绝对路径；相对路径以本 YAML 所在目录为基准。
# 明确指定所需文件，不扫描目录或推断 XML 文件名。

# 可选：默认读取 model 文件同目录下的 hardware_config.yaml。
# 显式指定时，相对路径仍以本 YAML 所在目录为基准。
hardware_config: ../models/talon/hardware_config.yaml

ecat_id: 0                        # EtherCAT 主站 ID，非负整数
cycle_time_us: 1000.0             # 控制周期（微秒），至少 1
duration_sec: -1.0                # 运行时长（秒），-1 为持续运行，0 为仅初始化
visualize: true                  # true 开启窗口，需要 linux-release 或 linux-debug 构建
