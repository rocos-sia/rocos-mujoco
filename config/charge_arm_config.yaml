# =============================================================================
# charge_arm 硬件描述配置文件
# 适用于 model/charge_arm.urdf 和 model/charge_arm.xml
# 7 关节: 1 个平动 (joint_1) + 6 个转动 (joint_2 ~ joint_7)
# =============================================================================

hardware:
  # ---------- joint_1: 平动关节 (末端推杆) ----------
  - id: 1
    type: driver
    joint_name: joint_1
    torque_source: load_torque
    limit:
      lower: 0.0
      upper: 0.2
      vel: 0.05
      acc: 0.5
      jerk: 10.0
      effort: 100.0
    transform:
      ratio: 1.0
      offset_pos_cnt: 0
      cnt_per_unit: 200000.0
      torque_per_unit: 1.0
      user_unit_name: m
    inputs:
      status_word: "Statusword"
      position_actual_value: "Position actual value"
      velocity_actual_value: "Velocity actual value"
      torque_actual_value: "Torque actual value"
      load_torque_value: "Analog Input 1"
      secondary_position_value: "Auxiliary position actual value"
      secondary_velocity_value: "Secondary velocity value"
      digital_inputs: "Digital Inputs"
      digital_outputs: "Digital Outputs"
    outputs:
      control_word: "Controlword"
      mode_of_operation: "Modes of operation"
      target_position: "Target position"
      target_velocity: "Target velocity"
      target_torque: "Target torque"
      digital_outputs: "Digital Outputs"

